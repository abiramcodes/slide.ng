# Groups the pull requests in the generated release notes by label.
changelog:
  exclude:
    labels:
      - 'release: skip'
  categories:
    - title: Breaking changes
      labels:
        - breaking changes
    - title: New features
      labels:
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - 'area: docs'
    - title: Other changes
      labels:
        - '*'
