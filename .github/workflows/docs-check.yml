name: Docs check

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Warns only. Add the `no-docs` label when a change needs no documentation.
      - name: Docs changed with the code
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NO_DOCS: ${{ contains(github.event.pull_request.labels.*.name, 'no-docs') }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          code=$(printf '%s\n' "$changed" | grep -E '^(src|scripts)/' | grep -vE '\.spec\.ts$' || true)
          docs=$(printf '%s\n' "$changed" | grep -E '^(docs/|README\.md$)' || true)
          if [ -z "$code" ]; then
            echo "No code changes that need docs."
          elif [ -n "$docs" ]; then
            echo "Code and docs both changed."
          elif [ "$NO_DOCS" = "true" ]; then
            echo "Code changed without docs, marked no-docs."
          else
            echo "::warning title=Docs not updated::This pull request changes src or scripts but nothing in docs. Update the docs, or add the no-docs label and say why."
            printf '%s\n' "$code"
          fi
