name: Bug report
description: Something does not work, or works differently from the docs
labels: [bug, needs triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Markdown, slides or layouts
        - Code blocks, math or diagrams
        - Presenter view, drawing or sync
        - Dev server
        - Export (PDF, PNG, PPTX, Markdown)
        - Build, hosting or offline use
        - Themes or addons
        - MCP server
        - Documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Say what you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal slides.md
      description: The smallest deck that shows the problem. Paste it, or link a repository.
      render: markdown
  - type: input
    id: version
    attributes:
      label: slide.ng version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version, operating system and browser
      placeholder: Node 22.23.3, Ubuntu 24.04, Chromium 140
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console or terminal output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read docs/STATUS.md, which lists what is missing or not checked.
          required: true
